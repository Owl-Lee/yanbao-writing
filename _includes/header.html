<header class="site-header" id="top">
  <div class="shell header-inner">
    <a class="identity" href="{{ '/' | relative_url }}" aria-label="Writing 首页">
      <strong>Yanbao Li</strong>
      <span>Writing / 随笔</span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' or page.layout == 'post' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
      <a href="{{ site.data.site.main_site }}">个人主页 ↗</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
